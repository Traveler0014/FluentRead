# @file .github/workflows/build-crx.yml
#
# 文件职责：在 fork 远端持续构建 FluentRead 的自用 CRX 产物。
# 主要内容：拉取当前 ref，安装依赖并构建 Chrome MV3，用仓库自带私钥签名出 CRX3，
#   上传 crx / zip 制品；按需（tag 或手动输入）创建 GitHub Release 并附加产物。
# 模块边界：只负责「编译 + 打包 + 发布制品」，不改写源码、不推送提交、不发布到浏览器商店。

name: Build CRX

on:
  # 每次同步官方 main 并合并本地修复后推送到 fork，都会产出一版新包。
  push:
    branches:
      - main
      - lite
    tags:
      - 'v*'
  # 需要临时出一版时手动触发；tag 留空则只上传 Actions 制品，不建 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: '填写后创建 / 覆盖同名 GitHub Release 并附加 crx（留空则只上传 Actions 制品）'
        required: false
        default: ''
        type: string

# 同一 ref 只保留最新一次构建，避免连续同步官方时排队。
concurrency:
  group: build-crx-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-crx:
    name: Build signed CRX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release 说明里要对比官方基线，需要完整历史。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # 不写 version：跟 package.json 的 packageManager 字段保持一致，
        # 两处同时指定会被 action-setup 判为版本冲突。

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # onnxruntime-node 同时存在 1.21.0（transformers 3.x）与 1.24.3（kokoro）时，
      # 两者的 libonnxruntime.so.1 会互相抢注 soname，导致 wxt prepare / build 直接崩溃。
      # 该预加载脚本把进程内所有 onnxruntime-node 请求收敛到最高版本；浏览器产物使用
      # onnxruntime-web，不受影响。postinstall 会跑 wxt prepare，因此 install 步骤也要带上。
      - name: Install dependencies
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/pin-onnxruntime-node.cjs
        run: pnpm install --frozen-lockfile

      - name: Build Chrome MV3
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/scripts/pin-onnxruntime-node.cjs
        run: pnpm build

      # 仅在 lite 分支校验产物不含被裁剪的重型资产；main 分支不维护该清单。
      - name: Verify Lite bundle
        if: github.ref_name == 'lite'
        run: pnpm verify:lite

      # 私钥放在仓库 secret 里，保证跨次构建扩展 ID 稳定，crx 能原地覆盖升级。
      # 没有配 secret 时退回一次性密钥，仅用于验证流程可用。
      - name: Prepare signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .output
          if [ -n "${CRX_PRIVATE_KEY:-}" ]; then
            printf '%s' "$CRX_PRIVATE_KEY" | base64 -d > .output/crx-key.pem
          else
            openssl genrsa -out .output/crx-key.pem 2048
            echo "::warning::未配置 CRX_PRIVATE_KEY secret，本次使用一次性密钥；扩展 ID 每次都会变化，无法原地升级。"
          fi
          openssl rsa -in .output/crx-key.pem -pubout -outform DER 2>/dev/null \
            | sha256sum | head -c 32 | tr '0-9a-f' 'a-p' > .output/extension-id.txt
          echo "extension id: $(cat .output/extension-id.txt)"

      - name: Pack CRX3
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$chrome_bin" ]; then
            echo "::error::runner 上找不到 Chrome / Chromium，无法执行 --pack-extension"
            exit 1
          fi
          rm -f .output/chrome-mv3.crx
          "$chrome_bin" \
            --pack-extension="$GITHUB_WORKSPACE/.output/chrome-mv3" \
            --pack-extension-key="$GITHUB_WORKSPACE/.output/crx-key.pem" \
            --no-message-box --no-sandbox
          test -s .output/chrome-mv3.crx

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          short_sha="$(git rev-parse --short HEAD)"
          base="fluent-read-${version}-chrome-mv3-${short_sha}"
          cp .output/chrome-mv3.crx ".output/${base}.crx"
          (cd .output/chrome-mv3 && zip -qr "../${base}.zip" .)
          {
            echo "base=${base}"
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "extension_id=$(cat .output/extension-id.txt)"
            echo "crx=.output/${base}.crx"
            echo "zip=.output/${base}.zip"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## FluentRead 自用 CRX"
            echo ""
            echo "- 版本：\`${version}\`（$(git rev-parse --short HEAD)）"
            echo "- 扩展 ID：\`$(cat .output/extension-id.txt)\`"
            echo "- 产物：\`${base}.crx\` / \`${base}.zip\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # archive: false 让制品保持原文件，下载下来直接就是 .crx / .zip，不用再解一层。
      - name: Upload CRX
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.collect.outputs.crx }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload unpacked ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.collect.outputs.zip }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      # 每次构建都会创建 / 刷新 release：
      # - 推送 main / 手动触发未填 tag → 滚动 release `latest`（每次重建，标签指向本次提交）；
      # - 推送 v* tag 或手动填了 tag → 对应的版本化 release。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.collect.outputs.base }}
          VERSION: ${{ steps.collect.outputs.version }}
          SHORT_SHA: ${{ steps.collect.outputs.short_sha }}
          EXTENSION_ID: ${{ steps.collect.outputs.extension_id }}
          CRX: ${{ steps.collect.outputs.crx }}
          ZIP: ${{ steps.collect.outputs.zip }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rolling=false
          title=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            title="${tag}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
            title="${tag}"
          else
            if [ "${GITHUB_REF_NAME}" = "lite" ]; then
              tag="latest-lite"
              title="FluentRead 自用精简构建（latest-lite）"
            else
              tag="latest"
              title="FluentRead 自用构建（latest）"
            fi
            rolling=true
          fi

          {
            echo "## FluentRead 自用构建"
            echo
            echo "- 版本：\`${VERSION}\`"
            echo "- 提交：\`${SHORT_SHA}\`"
            echo "- 扩展 ID：\`${EXTENSION_ID}\`"
            echo "- 构建时间：$(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "- 构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### 本次包含的提交"
            echo
            echo '```'
            git log --oneline -10
            echo '```'
            echo
            echo "### 安装"
            echo
            echo "1. 下载 \`${BASE}.crx\`，打开 \`chrome://extensions\` 开启「开发者模式」后拖入；"
            echo "2. 若浏览器拒绝安装非商店 CRX，改用 \`${BASE}.zip\` 解压后「加载已解压的扩展程序」。"
            echo
            echo "> 基于官方最新 main 合并本地 PR 修复构建；扩展 ID 与仓库 secret 中的私钥绑定，可直接原地覆盖升级。"
          } > /tmp/release-notes.md

          if [ "$rolling" = "true" ]; then
            # 滚动 release 每次重建，避免旧版本产物在资产列表里越堆越多。
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/release-notes.md
          else
            gh release view "$tag" >/dev/null 2>&1 \
              || gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/release-notes.md
            gh release edit "$tag" --title "$title" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$tag" "${CRX}" "${ZIP}" --clobber
          echo "release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
